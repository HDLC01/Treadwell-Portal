# Suite-wide pytest config. There was none before this file: no testpaths, no addopts, and — the
# part that mattered — no --durations, so a suite that had grown to ~26 minutes on CI had never
# once been asked which of its 816 tests were spending the time.
#
# --durations=25 is the point. Every cost blow-up in this suite has had the same cause: a database
# call nobody stubbed, sitting on the connection pool for its full 30-second timeout inside a
# guard that then correctly falls back. That is invisible — the test passes, the suite is just
# slow, and nobody investigates slow. Printing the slowest tests on every run is what makes the
# next one obvious. tests/conftest.py documents the ones found so far.
#
# Parallelism is deliberately NOT in addopts. `-n auto` costs a few seconds of worker startup,
# which is a real tax on the single-file runs you do while writing a test. Full runs ask for it
# explicitly (CI does, in .github/workflows/ci.yml):
#
#     python -m pytest -q -n auto --dist loadfile
#
# `--dist loadfile` is not optional. The default `--dist load` hands individual tests to whichever
# worker is free, which re-runs module-scoped fixtures once per worker — this suite has three that
# shell out to node (test_pdf_url_revision, test_portal_pricing_labels, test_view_signal_js) and
# are built to run once per file. loadfile keeps a file whole on one worker.
[pytest]
testpaths = tests
addopts = --durations=25
