# VPS staging — SHARED DB with the proposal tool (one source of truth).
# The portal connects to the proposal tool's staging Postgres (treadwell-staging-db
# on the treadwell-staging_default network), reads real `drafts`, and owns the
# portal_* tables in that same DB. DEV_SEED is OFF so it never injects stand-in
# drafts into the real table. OTP is delivered by EMAIL (Resend wired via .env) and
# is NOT shown on-screen — mirrors prod. Secrets (RESEND_API_KEY, EMAIL_FROM) live in
# .env on the VPS, never committed.
services:
  app:
    build: .
    image: treadwell-portal-staging:latest   # pinned so prod can `up -d` a prebuilt image (no on-box build)
    container_name: treadwell-portal-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8899:8898"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:staging_pg_pw@treadwell-staging-db:5432/treadwell
      PUBLIC_BASE_URL: https://staging.portal.wetreadwell.com
      ENVIRONMENT: staging
      DEV_SEED: "false"
      PORTAL_SHOW_OTP: "false"
      SERVICE_TOKEN: "stg-svc-3a9f2c7e1b4d8650"
      # Reach the proposal tool over the shared docker network (avoids the public
      # nginx hairpin/502); both are on treadwell-staging_default.
      PROPOSAL_TOOL_URL: "http://treadwell-staging:8888"
      # PUBLIC staff-tool URL for staff-notification "Reply in Portal" links. Must be
      # the STAGING staff tool (the config default is prod) so staging test emails
      # don't deep-link a staging-only proposal_id into the prod board (would 404).
      PROPOSAL_TOOL_PUBLIC_URL: "https://staging.proposals.wetreadwell.com"
      # Inbound email capture (Resend receiving): per-proposal Reply-To =
      # <token>@<domain>; replies webhook back into the CRM thread. The svix
      # signing secret (RESEND_WEBHOOK_SECRET) lives in .env on the VPS.
      #
      # Staging mints and receives on the BRANDED domain, same as prod.
      #
      # Sharing one receiving domain across environments is fine, and the token is
      # why: a reply goes to <token>@notify.wetreadwell.com, Resend delivers the
      # same event to BOTH webhook endpoints, and each environment resolves that
      # token against its own database. Staging tokens only exist in staging,
      # prod's only in prod, so each drops what isn't its own. No separate
      # receiving domain needed.
      #
      # The one behaviour that needs a single owner is UNTOKENED mail — a bare
      # proposals@notify.wetreadwell.com with no token to resolve. Sender matching
      # is the only way to place it, and both environments would attempt it. That
      # is what INBOUND_SENDER_FALLBACK below decides, per environment.
      RESEND_INBOUND_DOMAIN: "notify.wetreadwell.com"
      # ONE clean address on every customer email. No token in what anyone reads —
      # the proposal rides in the Message-ID/References headers instead, which mail
      # clients quote back on reply (verified against a real Gmail reply).
      INBOUND_REPLY_ADDRESS: "proposals@notify.wetreadwell.com"
      # Accepted, never minted: staging proposals sent before this change carry a
      # resend.app reply address, and those replies must still land.
      RESEND_INBOUND_LEGACY_DOMAINS: "piaxenoizh.resend.app"
      # Match untokened mail (someone emails proposals@ directly) to a single
      # proposal by sender; otherwise forward to the roster.
      #
      # OFF here because PROD owns untokened mail (2026-07-31). Both environments
      # receive the same account-wide Resend events, so with this on in both, one
      # bare proposals@ email whose sender also exists in the staging database
      # would be filed twice — once per environment. Prod is where real customers
      # send, so prod wins.
      #
      # Token-addressed replies are unaffected and still work here: staging mints
      # and resolves its own tokens on the branded domain, prod resolves its own.
      INBOUND_SENDER_FALLBACK: "false"
    networks:
      - shared

networks:
  shared:
    external: true
    name: treadwell-staging_default
