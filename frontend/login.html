<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Treadwell — Proposal Portal</title>
  <link rel="icon" href="/static/img/treadwell-bison.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <!-- Decorative: the wordmark beside it already says Treadwell, so alt text
         would make a screen reader announce the brand twice. -->
    <img class="brand-bison" src="/static/img/treadwell-bison.svg" alt="" width="44" height="28">
    <span class="brand">TREADWELL</span>
    <span class="tag" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span class="tag-text">Secure proposal portal</span>
    </span>
  </header>

  <main class="wrap" id="app">
    <section id="loading" class="card login-card" aria-busy="true">
      <div class="skeleton line" style="width:55%"></div>
      <div class="skeleton line" style="width:90%"></div>
    </section>
    <div id="login-target" class="hidden"></div>
    <div id="project-list" class="hidden"></div>
  </main>

  <script src="/auth.js"></script>
  <script src="/projects.js"></script>
  <script src="/shell.js"></script>
  <script src="/login.js"></script>
</body>
</html>
