name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      # --dist loadfile, not the default load: this suite has module-scoped fixtures that shell
      # out to node once per file (test_pdf_url_revision, test_portal_pricing_labels,
      # test_view_signal_js), and `load` hands individual tests to whichever worker is free —
      # which would re-run each of those harnesses once per worker. loadfile keeps a file whole
      # on one worker, so intra-file ordering and per-file setup both behave as they do serially.
      # --durations and testpaths come from backend/pytest.ini.
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q -n auto --dist loadfile

  # The real-Postgres tests (tests/test_pg_*.py) execute the portal's SQL against a scratch server:
  # every jsonb predicate, cast and ON CONFLICT the rest of the suite stubs. They skip unless
  # PORTAL_TEST_PG_URL is set, so without this job they never ran in CI (fix round #21). A throwaway
  # service container, reachable on localhost only (tests/pg_fixture.py refuses any other host);
  # each test module creates and drops its own tw_p3_* database in it.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PORTAL_TEST_PG_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      # A skipped pg test is a green tick that proved nothing, so the run fails if any is skipped.
      - name: Run the real-Postgres tests
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest tests/test_pg_*.py -q -rs -p no:cacheprovider | tee pg-tests.log
          if grep -Eq "SKIPPED|[0-9]+ skipped" pg-tests.log; then
            echo "a real-Postgres test was skipped"; exit 1
          fi
